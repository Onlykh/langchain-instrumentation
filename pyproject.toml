[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-instrumentation"
dynamic = ["version"]
description = "OpenTelemetry instrumentation for LangChain and LangGraph spans and metrics."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Onlykh" }]
keywords = ["opentelemetry", "langchain", "langgraph", "observability", "tracing", "genai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.43b0",
    "opentelemetry-semantic-conventions>=0.43b0",
    "wrapt>=1.14.0",
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]
dev = ["pytest>=7.0", "build>=1.2.2", "twine>=5.1.1"]

[project.urls]
Homepage = "https://github.com/Onlykh/openTelemetry-instrumentation-langchain"
Repository = "https://github.com/Onlykh/openTelemetry-instrumentation-langchain"
Issues = "https://github.com/Onlykh/openTelemetry-instrumentation-langchain/issues"

[project.entry-points.opentelemetry_instrumentor]
langchain = "langchain_instrumentation.instrumentor:LangChainInstrumentor"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_instrumentation*"]

[tool.setuptools.dynamic]
version = { attr = "langchain_instrumentation.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
